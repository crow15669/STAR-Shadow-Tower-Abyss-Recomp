# STAR settings. The launcher and the in-game menu (F2) change them as you go; you can also change a value here,
# save the file and start the game again. Lines that start with # are notes and are ignored. A setting without a
# line takes the STAR preset's value.

# The disc image the launcher starts (it fills this in when you choose one).
disc_image =

# Rendering resolution, as a multiple of the PlayStation 2's own (640x448).
#   1 = original    2 = 1280x896    3 = 1920x1344    4 = 2560x1792   (up to 8)
# Higher is sharper and smooths jagged edges. 3 suits a 1080p screen, 4 a 1440p one.
resolution = 3

# Extra edge smoothing on top of the resolution (FXAA). Softens the picture slightly.
fxaa = on

# Framerate: on = unlocked, in-between pictures for the camera and everything that moves, as many as the screen
# shows (60 a second on a 60 Hz screen, up to 144 on a 144 Hz one); off = the game's own 30fps.
smooth_60fps = on

# With the framerate unlocked: how many of the screen's refreshes get an in-between picture of their own:
#   auto = as many as the PC has time for    1 = every refresh    2 = every 2nd    3 = every 3rd    4 = every 4th
# 1 is the smoothest; in heavy scenes the PC may not manage every one.
smooth_pictures = auto

# The game's flicker filter: blends every screen line with the one above it. Made for old TVs; on a modern screen
# it only blurs the picture.
flicker_filter = off

# Sharp shadows. The game draws its shadows into a small buffer (256x256) and stretches it over the picture, which
# gives their edges coarse steps at any resolution. on = the shadows are drawn as fine as the picture itself.
sharp_shadows = on

# Creature shadows up close. The game leaves out a creature's shadow when the creature is close to the camera
# (beside it or partly behind it: its shadow program cannot draw what reaches past the screen's edge or behind the
# camera) and shortens it when the light comes from behind the camera. on = the shadow is drawn there too.
near_shadows = on

# Creatures' shadows on themselves. on = as the game draws them. The game's own self-shadows are very buggy: hard,
# many-cornered patches on shoulders, backs and sides that jump about as a creature breathes and come and go as you
# move. off = none: a creature's shadow still falls on the ground, the walls and others. Use off for the cleanest
# picture (best with sharp_shadows on; the Vulkan renderer).
self_shadows = off

# Creature shadows stop at walls. The game's shadow of a creature goes on through pillars and walls: the same shadow
# shows again on the far side of a pillar (turned away from the light) and on the ground behind it. on = a creature's
# shadow is left off surfaces turned away from the shadow light and off surfaces with scenery between them and the
# creature (the scenery has to be on screen for that). off = as the game draws them. The Vulkan renderer.
shadow_walls = on

# The game's soft glow over the picture.
glow = on

# Gameplay (also in the game: F2, Gameplay).

# Texts of the English patch that overlap on screen are laid out anew, and damaged letters are put right; the wording
# stays (so far: in Item Repair "Consume HP" and the cost are one centred line, because the cost was drawn on top of
# "HP"; four item texts had a broken character: Yin-Yang Charm, Hide Gloves, Stun Gun, S&W No. 2). off = as the game
# has them.
text_fixes = on

# Reduced input lag (recommended).
# Late input: the game reads the controls at the last moment, just before it needs them, so walking, buttons and the
# controller answer about 45 ms sooner (measured: 79 ms on average from a key to its frame, 34 ms with this on). If a
# frame of the game ever runs long it reads them the usual way for a while, so it never costs a frame.
late_input = on

# True analog aiming with the right stick: the view turns and tilts by how far the stick is pushed, in any direction,
# instead of in steps. For the control types that look with the right stick (Type 4; Type 3 for up and down).
analog_aim = on

# Top speeds with the stick fully over, in percent of the game's own (75 to 300). Above 100 the game's camera moves
# faster than it was made for and much of the original game's challenge goes: not recommended.
aim_turn_speed = 100
aim_look_speed = 100

# Experimental (also in the game: F2, Experimental). These settings fundamentally go against the game's intended
# experience and are recommended for repeat playthroughs.

# Mouse and keyboard play. Click on the game to give it the mouse; Alt+Tab or the F2 menu take it back. The mouse
# looks around; the other controls are the bind_ lines below. A controller keeps working as before; the game follows
# whichever was used last.
mouse_keyboard = on

# Mouse sensitivity in percent (25 to 400), and up/down the other way round. Above 100 the game's camera moves
# faster than it was made for and much of the original game's challenge goes: not recommended.
mouse_sensitivity = 100
mouse_invert_y = off

# Low delay: every picture shown follows the mouse, instead of the view turning with the game's own 30 steps a
# second (about a twentieth of a second later). Needs smooth_60fps on. off if the view misbehaves while turning.
mouse_live_view = on

# The right button with a gun: toggle = press to aim, press again to holster; hold = out while the button is down.
gun_button = toggle

# Swings of swords and the like with the mouse:
#   direction = camera-based directional swings: the left button swings the way the view last moved (a small arrow
#               shows it and fades; think Mount & Blade, Chivalry);
#   flick     = holding the right button locks the view, and a flick of the mouse left, right, up or down swings;
#   buttons   = binds for each swing (recommended): left button right to left, right button left to right, wheel up
#               the stab, wheel down the overhead swing (the wheel then no longer switches weapons; R and Tab do).
#   (The buttons of each are bind_ lines below.)
melee_swings = buttons

# What slows turning down in the game (ailments, carrying too much, some ground), on the mouse: off = not at all;
# soft = softened (half speed in the game is 71% with the mouse); full = as much as with a controller.
mouse_slowdown = full

# The mouse and keyboard controls (the launcher: Experimental, Change controls...; in the game: F2, Experimental).
# Up to four each, separated by commas: keys by name (W, LeftShift, Space, Return, Escape, Tab, Keypad+5 ...), mouse
# buttons (MouseLeft, MouseRight, MouseMiddle, Mouse4, Mouse5) or the wheel (WheelUp, WheelDown, Wheel = either way);
# none = nothing. The swings of the sword swing style chosen (melee_swings) win over the other controls' inputs.
bind_move_forward = W, Up
bind_move_back = S, Down
bind_strafe_left = A, Left
bind_strafe_right = D, Right
bind_walk = LeftShift
bind_fire = MouseLeft
bind_gun = MouseRight
bind_swing_view = MouseLeft
bind_swing_flick = MouseRight
bind_swing_right_left = MouseLeft
bind_swing_left_right = MouseRight
bind_stab = WheelUp
bind_overhead = WheelDown
bind_switch_weapons = R, Tab, Wheel
bind_magic = Q, MouseMiddle
bind_use_item = F
bind_act = E, Space, Return, Keypad+Enter
bind_menu = Escape, Backspace
bind_pause = P

# A Debug page on the F2 menu: put any item into the inventory, jump to any of the game's maps or to remembered
# places (kept in "STAR places.txt"), and bring in any creature. For finding faults faster. It changes the game's
# own data: a jump starts the area afresh as loading a save does. Read at start-up. It also turns on two developer
# keys: F8 saves a memory dump (about 32 MB a press) and F10 one frame's drawing data, into the program's folder.
debug_menu = off

# Fault reports: keep the last few seconds of pictures in memory. When something flickers, press F1 at once
# and they are saved as a catch (the game pauses a few seconds while it writes).
record_pictures = off

# How many F1 catches are kept (0 = all). Each takes about 250 MB of disk space (512 uncompressed pictures), so they
# add up quickly: 10 are 2.5 GB. A new one takes the place of the oldest. They are in the logs folder next to
# STAR.exe: pictures_1, pictures_2, ...
record_keep = 5

# Look for a newer version of STAR when the launcher opens: on or off. It asks GitHub, where STAR is published,
# for the number of the latest version; nothing else is sent. The launcher's Updates tab has the same switch.
check_updates = on

# The preset chosen in the launcher: original, remastered, star or custom (empty: whichever the settings match).
preset =

# Your own settings, kept by the launcher for its Custom preset while you try another preset (it fills this in).
custom =
